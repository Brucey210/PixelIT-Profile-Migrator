name: Dependency security audit
on:
  push:
    branches: [main]
    paths: ["pyproject.toml", ".github/workflows/dependency-audit.yml"]
  pull_request:
    branches: [main]
    paths: ["pyproject.toml", ".github/workflows/dependency-audit.yml"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit
      - name: Audit resolved dependencies
        run: python -m pip_audit
