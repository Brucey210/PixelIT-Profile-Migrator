name: Python tests
on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", "main.py", ".github/workflows/tests.yml", ".github/workflows/windows-build-check.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", "main.py", ".github/workflows/tests.yml", ".github/workflows/windows-build-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -v --cov=pixelit_migrator --cov-report=term-missing
