name: Windows portable build check
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "main.py", ".github/workflows/windows-build-check.yml", ".github/workflows/tests.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", "main.py", ".github/workflows/windows-build-check.yml", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
      - name: Run tests
        run: python -m pytest -v
      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --name PixelIT-Profile-Migrator --collect-all cryptography --paths src main.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/PixelIT-Profile-Migrator/PixelIT-Profile-Migrator.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "PyInstaller did not produce the expected executable: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length
      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PixelIT-Profile-Migrator" -DestinationPath "dist/PixelIT-Profile-Migrator-Windows-x64.zip" -CompressionLevel Optimal
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PixelIT-Profile-Migrator-Windows-x64
          path: dist/PixelIT-Profile-Migrator-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
