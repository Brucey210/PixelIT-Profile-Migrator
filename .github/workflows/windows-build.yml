name: Windows portable build (alpha)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
      - name: Run tests
        run: python -m pytest -v
      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --name PixelIT-Profile-Migrator --collect-all cryptography --collect-all PySide6 --paths src main.py
      - name: Include technician documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/PixelIT-Profile-Migrator/README.md
          Copy-Item SECURITY.md dist/PixelIT-Profile-Migrator/SECURITY.md
          Copy-Item BUILD_WINDOWS.md dist/PixelIT-Profile-Migrator/BUILD_WINDOWS.md
      - uses: actions/upload-artifact@v4
        with:
          name: PixelIT-Profile-Migrator-Windows-Alpha
          path: dist/PixelIT-Profile-Migrator/
          if-no-files-found: error
          retention-days: 14
