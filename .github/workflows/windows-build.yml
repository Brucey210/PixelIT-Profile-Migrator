name: Windows portable build (alpha)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyinstaller
      - name: Run tests
        run: python -m pytest -v
      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --name PixelIT-Profile-Migrator --collect-all cryptography --paths src main.py
      - name: Verify portable executable and create SHA-256 checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist/PixelIT-Profile-Migrator").Path
          $exe = Join-Path $root "PixelIT-Profile-Migrator.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "PyInstaller executable was not produced at the expected path."
          }
          Copy-Item README.md (Join-Path $root "README.md")
          Copy-Item SECURITY.md (Join-Path $root "SECURITY.md")
          Copy-Item BUILD_WINDOWS.md (Join-Path $root "BUILD_WINDOWS.md")
          $lines = Get-ChildItem -Path $root -File -Recurse |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName)
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              "$($hash.Hash.ToLower())  $relative"
            }
          $lines | Set-Content -Encoding utf8 (Join-Path $root "SHA256SUMS.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: PixelIT-Profile-Migrator-Windows-Alpha
          path: dist/PixelIT-Profile-Migrator/
          if-no-files-found: error
          retention-days: 14
