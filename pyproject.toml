[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelit-profile-migrator"
version = "0.1.0"
description = "Portable profile migration toolkit for Pixel IT technicians"
requires-python = ">=3.11"
dependencies = ["cryptography>=44.0.0", "PySide6>=6.8.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pixelit-migrator = "pixelit_migrator.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
